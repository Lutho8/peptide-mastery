name: Quality gate

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Authentication regression gate
        run: npm run test:auth

      - name: Lint
        shell: bash
        run: |
          mapfile -t files < <(git diff --diff-filter=ACMR --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          if ((${#files[@]})); then
            npx eslint "${files[@]}"
          fi

      - name: Test
        run: npm test

      - name: Build development bundle
        run: npm run build:dev
